<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

            text-align: center;

            color: white;
        }

<body>

    <div class="box">
        <h1>سلام 👋</h1>

        <p>به سایت من خوش آمدید!</p>

    </div>

</html>
